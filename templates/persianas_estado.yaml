      to: [subir, bajar, parar]
      id: orden
    - trigger: state
      entity_id: sensor.persiana_dormitorio_principal_ultima_orden
      to: [subir, bajar]
      for:
        seconds: "{{ states('number.persiana_dormitorio_principal_travel_time') | float(35) }}"
      id: fin
  actions:   # la macro una vez; en actions no hay `this`: el estado anterior se lee por su nombre
    - variables:
        r: "{% from 'persianas.jinja' import persiana %}{{ persiana(states('sensor.persiana_dormitorio_principal_posicion'), state_attr('sensor.persiana_dormitorio_principal_posicion', 'mov'), state_attr('sensor.persiana_dormitorio_principal_posicion', 't0'), trigger.to_state.state if trigger.id == 'orden' else '', states('number.persiana_dormitorio_principal_travel_time') | float(35), now().timestamp(), true) | from_json }}"
  sensor:
    - name: Persiana Dormitorio Principal posición
      unique_id: persiana_dormitorio_principal_posicion
      default_entity_id: sensor.persiana_dormitorio_principal_posicion
      unit_of_measurement: "%"
      icon: mdi:window-shutter
      state: "{{ r.pos }}"
      attributes:
        mov: "{{ r.mov }}"
        t0: "{{ r.t0 }}"
- cover:
    - name: Persiana Dormitorio Principal
      unique_id: estado_persiana_dormitorio_principal
      default_entity_id: cover.estado_persiana_dormitorio_principal
      device_class: blind
      state: >-
        {% set m = state_attr('sensor.persiana_dormitorio_principal_posicion', 'mov') | int(0) %}{% set p = states('sensor.persiana_dormitorio_principal_posicion') | int(none) %}
        {{ 'opening' if m > 0 else 'closing' if m < 0 else none if p is none else 'closed' if p <= 3 else 'open' }}
      # Sin posición mientras se mueve: así siempre cambia al terminar y pisa el % que HA guarda solo al pedir un %.
      position: "{{ none if state_attr('sensor.persiana_dormitorio_principal_posicion', 'mov') | int(0) != 0 else states('sensor.persiana_dormitorio_principal_posicion') | int(none) }}"
      open_cover:
        - action: cover.open_cover
          target:
            entity_id: cover.persiana_dormitorio_principal
      close_cover:
        - action: cover.close_cover
          target:
            entity_id: cover.persiana_dormitorio_principal
      stop_cover:
        - action: cover.stop_cover
          target:
            entity_id: cover.persiana_dormitorio_principal
      # Broken motor: if stopped halfway it falls by gravity, so it never stops halfway.
      # A % goes all the way in the direction requested (lower → down, raise → up).
      set_cover_position:
        - variables:
            actual: "{{ states('sensor.persiana_dormitorio_principal_posicion') | float(50) }}"
            inicio: "{{ now().timestamp() }}"
        # Si es un "sube/baja" de Alexa sin % (a esta persiana o al grupo), va del todo en esa dirección.
        - delay: 1
        - variables:
            alexa: "{{ states('sensor.alexa_ajuste_persiana') in ['cover.estado_persiana_dormitorio_principal', 'cover.persianas'] and (state_attr('sensor.alexa_ajuste_persiana', 't') | float(0) - inicio | float(0)) | abs < 5 }}"
            position: "{{ (100 if position > state_attr('sensor.alexa_ajuste_persiana', 'antes') | float(50) else 0) if alexa else position }}"
        - if: "{{ position >= 97 or (position > 3 and position > actual) }}"
          then:
            - action: cover.open_cover
              target:
                entity_id: cover.persiana_dormitorio_principal
          else:
            - action: cover.close_cover
              target:
                entity_id: cover.persiana_dormitorio_principal
