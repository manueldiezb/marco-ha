# Estado de las persianas Tuya (no informan de su posición). Lógica en custom_templates/persianas.jinja.
# cover.estado_persiana_* manda las órdenes a la persiana real y muestra abierta/cerrada/% en los paneles.

# Alexa en español manda "sube/baja la(s) persiana(s)" como AdjustRangeValue (+-25 %), no como abrir/cerrar.
# Se apunta aquí a qué persiana (o al grupo cover.persianas) y desde qué posición, para que cada
# set_cover_position lo convierta en subir/bajar del todo en esa dirección.
- triggers:
    - trigger: event
      event_type: alexa_smart_home
      event_data:
        request:
          name: AdjustRangeValue
  sensor:
    - name: Alexa ajuste persiana
      unique_id: alexa_ajuste_persiana
      default_entity_id: sensor.alexa_ajuste_persiana
      state: "{{ trigger.event.data.request.entity_id }}"
      attributes:
        t: "{{ now().timestamp() }}"
        antes: "{{ state_attr(trigger.event.data.request.entity_id, 'current_position') }}"

- triggers:
    - trigger: state
      entity_id: sensor.persiana_salon_ultima_orden
      to: [subir, bajar, parar]
      id: orden
    - trigger: state
      entity_id: sensor.persiana_salon_ultima_orden
      to: [subir, bajar]
      for:
        seconds: "{{ state_attr('cover.persiana_salon','tr_timecontrol') | float(27) }}"
      id: fin
  actions:   # la macro una vez; en actions no hay `this`: el estado anterior se lee por su nombre
    - variables:
        r: "{% from 'persianas.jinja' import persiana %}{{ persiana(states('sensor.persiana_salon_posicion'), state_attr('sensor.persiana_salon_posicion', 'mov'), state_attr('sensor.persiana_salon_posicion', 't0'), trigger.to_state.state if trigger.id == 'orden' else '', state_attr('cover.persiana_salon','tr_timecontrol') | float(27), now().timestamp()) | from_json }}"
  sensor:
    - name: Persiana Salón posición
      unique_id: persiana_salon_posicion
      default_entity_id: sensor.persiana_salon_posicion
      unit_of_measurement: "%"
      icon: mdi:window-shutter
      state: "{{ r.pos }}"
      attributes:
        mov: "{{ r.mov }}"
        t0: "{{ r.t0 }}"
- cover:
    - name: Persiana Salón
      unique_id: estado_persiana_salon
      default_entity_id: cover.estado_persiana_salon
      device_class: blind
      state: >-
        {% set m = state_attr('sensor.persiana_salon_posicion', 'mov') | int(0) %}{% set p = states('sensor.persiana_salon_posicion') | int(none) %}
        {{ 'opening' if m > 0 else 'closing' if m < 0 else none if p is none else 'closed' if p <= 3 else 'open' }}
      # Sin posición mientras se mueve: así siempre cambia al terminar y pisa el % que HA guarda solo al pedir un %.
      position: "{{ none if state_attr('sensor.persiana_salon_posicion', 'mov') | int(0) != 0 else states('sensor.persiana_salon_posicion') | int(none) }}"
      open_cover:
        - action: cover.open_cover
          target:
            entity_id: cover.persiana_salon
      close_cover:
        - action: cover.close_cover
          target:
            entity_id: cover.persiana_salon
      stop_cover:
        - action: cover.stop_cover
          target:
            entity_id: cover.persiana_salon
      # Ir a un % (Alexa, panel): se manda subir/bajar y se para al cabo de |destino − actual| × recorrido.
      # Si no se sabe dónde está, primero baja del todo para tener referencia.
      set_cover_position:
        - variables:
            travel: "{{ state_attr('cover.persiana_salon','tr_timecontrol') | float(27) }}"
            inicio: "{{ now().timestamp() }}"
        # Si es un "sube/baja" de Alexa sin % (a esta persiana o al grupo), va del todo en esa dirección.
        - delay: 1
        - variables:
            alexa: "{{ states('sensor.alexa_ajuste_persiana') in ['cover.estado_persiana_salon', 'cover.persianas'] and (state_attr('sensor.alexa_ajuste_persiana', 't') | float(0) - inicio | float(0)) | abs < 5 }}"
            position: "{{ (100 if position > state_attr('sensor.alexa_ajuste_persiana', 'antes') | float(50) else 0) if alexa else position }}"
        - if: "{{ state_attr('sensor.persiana_salon_posicion', 'mov') | int(0) != 0 }}"
          then:
            - action: cover.stop_cover
              target:
                entity_id: cover.persiana_salon
            - delay: 1
        - choose:
            - conditions: "{{ position >= 97 }}"
              sequence:
                - action: cover.open_cover
                  target:
                    entity_id: cover.persiana_salon
            - conditions: "{{ position <= 3 }}"
              sequence:
                - action: cover.close_cover
                  target:
                    entity_id: cover.persiana_salon
          default:
            - if: "{{ states('sensor.persiana_salon_posicion') | int(none) is none }}"
              then:
                - action: cover.close_cover
                  target:
                    entity_id: cover.persiana_salon
                - wait_template: "{{ states('sensor.persiana_salon_posicion') | int(-1) == 0 }}"
                  timeout:
                    seconds: "{{ travel + 10 }}"
            - variables:
                actual: "{{ states('sensor.persiana_salon_posicion') | float(0) }}"
            - condition: template
              value_template: "{{ (position - actual) | abs >= 3 }}"
            - action: "{{ 'cover.open_cover' if position > actual else 'cover.close_cover' }}"
              target:
                entity_id: cover.persiana_salon
            - delay:
                seconds: "{{ ((position - actual) | abs / 100 * travel) | round(1) }}"
            - action: cover.stop_cover
              target:
                entity_id: cover.persiana_salon

